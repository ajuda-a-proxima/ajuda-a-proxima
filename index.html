<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ryan Brother</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">

<style>
body{
 margin:0;
 font-family:'Fredoka',sans-serif;
 color:#fff;
 text-align:center;
 background:linear-gradient(45deg,#000,#111,#222);
 background-size:400% 400%;
 animation:bg 10s infinite;
}

@keyframes bg{
 0%{background-position:0% 50%;}
 50%{background-position:100% 50%;}
 100%{background-position:0% 50%;}
}

.cyber{
 font-size:2.5em;
 color:#0ff;
 text-shadow:0 0 10px #0ff,0 0 20px #f0f;
 animation:glitch 1s infinite;
}

@keyframes glitch{
 0%{opacity:1;}
 50%{opacity:0.5;}
 100%{opacity:1;}
}

button{
 padding:10px;
 margin:5px;
 border:none;
 border-radius:10px;
 background:yellow;
 cursor:pointer;
}

iframe{
 width:300px;
 height:170px;
 border-radius:10px;
}

canvas{
 background:#fff;
 border-radius:10px;
 touch-action:none;
}

.colors{
 display:flex;
 flex-wrap:wrap;
 justify-content:center;
}

.color{
 width:25px;
 height:25px;
 border-radius:50%;
 margin:4px;
 cursor:pointer;
}

#chat{
 height:150px;
 overflow:auto;
 background:#111;
 padding:5px;
 border-radius:10px;
 text-align:left;
}

.tip{
 display:inline-block;
 background:#222;
 padding:6px;
 border-radius:10px;
 margin:4px;
 cursor:pointer;
}
</style>
</head>

<body>

<h1 class="cyber">🎮 RYAN BROTHER 🚀</h1>

<button onclick="subscribe()">🔥 SE INSCREVER 🔥</button>

<!-- VIDEOS -->
<h2>📺 Vídeos</h2>
<iframe src="https://www.youtube.com/embed/2pT_e6ukSCo"></iframe>
<iframe src="https://www.youtube.com/embed/pvH9Rrqs_Uc"></iframe>

<!-- IDEIAS -->
<h2>💡 Ideias de desenho</h2>
<button onclick="gerarIdeia()">Gerar ideia</button>
<p id="idea"></p>

<!-- ESCOLHA -->
<select onchange="loadTemplate(this.value)">
<option value="">Escolha...</option>
<option value="cat">🐱 Gato</option>
<option value="dog">🐶 Cachorro</option>
<option value="car">🚗 Carro</option>
<option value="house">🏠 Casa</option>
</select>

<!-- DESENHO -->
<canvas id="draw" width="300" height="300"></canvas>

<div class="colors" id="colors"></div>

<button onclick="mixColor()">🌈 Misturar</button>
<button onclick="clearCanvas()">🧹 Limpar</button>

<!-- JOGO -->
<h2>🎮 Jogo</h2>
<button onclick="play()">CLICA</button>
<p id="score">0</p>

<!-- CHAT -->
<h2>🤖 RayBot com Voz</h2>

<div id="chat"></div>
<input id="msg" placeholder="Fala comigo...">
<button onclick="sendMsg()">Enviar</button>

<script>

// 🔊 VOZ
function falar(texto){
 let msg=new SpeechSynthesisUtterance(texto);
 msg.lang="pt-BR";
 msg.pitch=1.3;
 speechSynthesis.speak(msg);
}

// 🎯 YOUTUBE
function subscribe(){
 window.open("https://youtube.com/@ryanbrother6541");
}

// 💡 IDEIAS
function gerarIdeia(){
 let ideias=[
  "Desenha um personagem Roblox!",
  "Desenha um dragão!",
  "Desenha um mapa de jogo!",
  "Desenha um pet mágico!"
 ];
 document.getElementById("idea").innerText=
 ideias[Math.floor(Math.random()*ideias.length)];
}

// 🎨 CORES
const colorsDiv=document.getElementById("colors");
["red","blue","green","yellow","orange","purple","pink","black","brown"]
.forEach(c=>{
 let d=document.createElement("div");
 d.className="color";
 d.style.background=c;
 d.onclick=()=>color=c;
 colorsDiv.appendChild(d);
});

let color="black";

// 🖌️ DESENHO
const canvas=document.getElementById("draw");
const ctx=canvas.getContext("2d");

let drawing=false;

canvas.addEventListener("pointerdown",()=>drawing=true);
canvas.addEventListener("pointerup",()=>drawing=false);
canvas.addEventListener("pointermove",e=>{
 if(!drawing)return;
 let r=canvas.getBoundingClientRect();
 ctx.fillStyle=color;
 ctx.fillRect(e.clientX-r.left,e.clientY-r.top,4,4);
});

// MOLDE
function loadTemplate(type){
 ctx.clearRect(0,0,300,300);
 ctx.strokeStyle="gray";

 if(type==="cat"){
  ctx.beginPath();
  ctx.arc(150,150,60,0,Math.PI*2);
  ctx.stroke();
 }

 if(type==="dog"){
  ctx.beginPath();
  ctx.arc(150,150,70,0,Math.PI*2);
  ctx.stroke();
 }

 if(type==="car"){
  ctx.strokeRect(80,150,140,50);
 }

 if(type==="house"){
  ctx.strokeRect(100,150,100,80);
 }
}

// MIX
function mixColor(){
 color=`rgb(${Math.random()*255},${Math.random()*255},${Math.random()*255})`;
}

// LIMPAR
function clearCanvas(){
 ctx.clearRect(0,0,300,300);
}

// 🎮 JOGO
let score=0;
function play(){
 score++;
 document.getElementById("score").innerText=score;
}

// 🤖 CHAT INTELIGENTE + VOZ
function sendMsg(){
 let input=document.getElementById("msg");
 let chat=document.getElementById("chat");

 let text=input.value.toLowerCase();

 chat.innerHTML+=`<p>👦 ${input.value}</p>`;

 let respostas=[
  "🎮 Bora jogar!",
  "🎨 Você desenha muito bem!",
  "🔥 Vamos se divertir!",
  "🚀 Vai lá no canal do Ryan!"
 ];

 if(text.includes("desenho")){
  respostas=["🎨 Desenha um robô!", "🎨 Faz um dragão!"];
 }

 let reply=respostas[Math.floor(Math.random()*respostas.length)];

 setTimeout(()=>{
  chat.innerHTML+=`<p>🤖 ${reply}</p>`;
  falar(reply);
  chat.scrollTop=chat.scrollHeight;
 },400);

 input.value="";
}

</script>

</body>
</html>
