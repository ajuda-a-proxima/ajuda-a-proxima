<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ryan Brother</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
body{margin:0;background:#000;color:#fff;text-align:center;font-family:'Fredoka',sans-serif}
h1{font-size:2.8em;color:#00ffff;margin:10px 0}
button{padding:10px 14px;margin:6px;border:none;border-radius:12px;background:#ff0;cursor:pointer}
.videos{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
iframe{width:300px;height:170px;border-radius:12px}

#draw{background:#fff;border-radius:12px;touch-action:none;margin-top:10px}
.colors{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:8px 0}
.color{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid #222}

#chatBox{background:#111;max-width:320px;margin:10px auto;padding:10px;border-radius:12px}
#chat{height:140px;overflow:auto;background:#000;padding:6px;border-radius:8px;text-align:left}
input{padding:8px;border-radius:8px;border:none;margin:4px}

.tip{display:inline-block;background:#222;padding:6px 10px;border-radius:10px;margin:4px;cursor:pointer}
</style>
</head>

<body>

<h1>🎮 RYAN BROTHER 🚀</h1>

<button onclick="subscribe()">🔥 SE INSCREVER 🔥</button>

<input id="name" placeholder="Seu nome">
<button onclick="login()">Entrar</button>
<p id="userDisplay"></p>

<!-- VIDEOS -->
<h2>📺 Vídeos</h2>
<div class="videos">
<iframe src="https://www.youtube.com/embed/2pT_e6ukSCo"></iframe>
<iframe src="https://www.youtube.com/embed/pvH9Rrqs_Uc"></iframe>
<iframe src="https://www.youtube.com/embed/s5lKL9kgZNo"></iframe>
<iframe src="https://www.youtube.com/embed/Da8ti-pUHXA"></iframe>
</div>

<!-- DICAS -->
<h2>💡 Ideias de desenho</h2>
<div>
<span class="tip" onclick="setIdea('robô')">🤖 Robô</span>
<span class="tip" onclick="setIdea('carro')">🚗 Carro</span>
<span class="tip" onclick="setIdea('casa')">🏠 Casa</span>
<span class="tip" onclick="setIdea('dragão')">🐉 Dragão</span>
<span class="tip" onclick="setIdea('animal')">🐶 Animal</span>
</div>

<p id="idea"></p>

<!-- DESENHO -->
<h2>🎨 Desenhe</h2>
<canvas id="draw" width="300" height="300"></canvas>

<div class="colors" id="colors"></div>

<button onclick="mixColor()">🌈 Misturar</button>
<button onclick="clearCanvas()">🧹 Limpar</button>
<button onclick="saveDraw()">💾 Salvar</button>

<!-- JOGO -->
<h2>🎮 Jogo</h2>
<button onclick="play()">CLICA</button>
<p id="score">0</p>

<h2>🏆 Ranking</h2>
<ul id="ranking"></ul>

<!-- CHAT -->
<h2>🤖 RayBot</h2>
<div id="chatBox">
<div id="chat"></div>
<input id="msg" placeholder="Fala comigo...">
<button onclick="sendMsg()">Enviar</button>
</div>

<script>

// 🔥 FIREBASE
const firebaseConfig = {
 apiKey: "AIzaSyCROWVPT74uPPmIk_mfpV3WDnoU15VzC9U",
 authDomain: "canal-ryan-brother-roblox.firebaseapp.com",
 databaseURL: "https://canal-ryan-brother-roblox-default-rtdb.firebaseio.com"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// 🔊 SOM
const audioClick = new Audio("https://www.soundjay.com/buttons/sounds/button-16.mp3");

// LOGIN
let user="";
function login(){
 user=document.getElementById("name").value;
 if(!user)return;
 localStorage.setItem("user",user);
 document.getElementById("userDisplay").innerText="👤 "+user;
}
window.onload=()=>{
 let saved=localStorage.getItem("user");
 if(saved){user=saved;document.getElementById("userDisplay").innerText="👤 "+user;}
};

// YOUTUBE
function subscribe(){
 audioClick.play();
 window.open("https://youtube.com/@ryanbrother6541");
}

// IDEIA
function setIdea(txt){
 document.getElementById("idea").innerText="Desenhe um "+txt+"!";
}

// CORES (GERA VÁRIAS)
const colorsDiv=document.getElementById("colors");
const palette=["red","blue","green","yellow","orange","purple","pink","brown","black","gray"];
palette.forEach(c=>{
 let d=document.createElement("div");
 d.className="color";
 d.style.background=c;
 d.onclick=()=>color=c;
 colorsDiv.appendChild(d);
});

let color="black";

// DESENHO
const canvas=document.getElementById("draw");
const ctx=canvas.getContext("2d");
let drawing=false;

canvas.addEventListener("pointerdown",()=>drawing=true);
canvas.addEventListener("pointerup",()=>drawing=false);
canvas.addEventListener("pointermove",e=>{
 if(!drawing)return;
 let r=canvas.getBoundingClientRect();
 ctx.fillStyle=color;
 ctx.fillRect(e.clientX-r.left,e.clientY-r.top,4,4);
});

// MIX
function mixColor(){
 color=`rgb(${Math.random()*255},${Math.random()*255},${Math.random()*255})`;
}

// LIMPAR
function clearCanvas(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
}

// SALVAR
function saveDraw(){
 if(!user)return alert("Digite nome");
 let id=Date.now();
 let img=canvas.toDataURL();
 db.ref("draws/"+id).set({user,image:img});
}

// JOGO
let score=0;
function play(){
 audioClick.play();
 score++;
 document.getElementById("score").innerText=score;
 if(user){db.ref("ranking/"+user).set(score);}
}

// RANKING
db.ref("ranking").on("value",snap=>{
 let data=snap.val()||{};
 let list=document.getElementById("ranking");
 list.innerHTML="";
 Object.keys(data).sort((a,b)=>data[b]-data[a]).forEach(n=>{
  let li=document.createElement("li");
  li.innerText=n+" - "+data[n];
  list.appendChild(li);
 });
});

// 🤖 CHAT MAIS VARIADO
function sendMsg(){
 let input=document.getElementById("msg");
 let chat=document.getElementById("chat");
 let t=input.value.toLowerCase();

 chat.innerHTML+=`<p>👦 ${input.value}</p>`;

 let respostas=[
 "🎮 Bora jogar!",
 "🎨 Faz um desenho incrível!",
 "🚀 Você é muito bom!",
 "🔥 Tenta bater o recorde!",
 "😄 Que tal ver os vídeos?"
 ];

 let r=respostas[Math.floor(Math.random()*respostas.length)];

 if(t.includes("desenho")) r="🎨 Desenha um dragão!";
 if(t.includes("jogo")) r="🎮 Clica no botão!";
 if(t.includes("oi")) r="👋 Oii! Vamos brincar?";

 setTimeout(()=>{
  chat.innerHTML+=`<p>🤖 ${r}</p>`;
  chat.scrollTop=chat.scrollHeight;
 },400);

 input.value="";
}

</script>

</body>
</html>
