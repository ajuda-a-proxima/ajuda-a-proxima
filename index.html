<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ryan Brother | Hub Oficial de Games, Códigos Roblox & Streams</title>
  
  <!-- Meta tags SEO e Redes Sociais -->
  <meta name="description" content="Portal oficial do Ryan Brother (@ryanbrothertube). Códigos grátis de Roblox (MM2/Xerife, Blox Fruits, Adopt Me), Roleta de Prêmios, Redes Sociais (YouTube, TikTok, Instagram, Kwai, Twitch) e Chatbot!" />
  <meta name="keywords" content="Ryan Brother, ryanbrother6541, codigos roblox, roblox promo codes, mm2 xerife, blox fruits, adopt me, brookhaven, roleta de premios, gamer" />
  <meta name="theme-color" content="#090a10" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg-dark: #07080f;
      --bg-surface: #0f1322;
      --bg-surface-2: #161c30;
      --bg-card: rgba(22, 28, 48, 0.85);
      
      --cyan: #00f0ff;
      --cyan-glow: rgba(0, 240, 255, 0.4);
      --purple: #9d4edd;
      --purple-glow: rgba(157, 78, 221, 0.4);
      --magenta: #f72585;
      --magenta-glow: rgba(247, 37, 133, 0.4);
      --neon-green: #00ff88;
      --neon-green-glow: rgba(0, 255, 136, 0.4);
      --neon-gold: #ffb703;
      --neon-gold-glow: rgba(255, 183, 3, 0.4);
      --roblox-red: #e02424;
      
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.1);
      
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 22px;
      --radius-full: 9999px;
      
      --font-display: 'Orbitron', sans-serif;
      --font-heading: 'Rajdhani', sans-serif;
      --font-fun: 'Fredoka', cursive;
      --font-body: 'Inter', sans-serif;
      
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-body);
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: -20%;
      left: -10%;
      width: 55vw;
      height: 55vw;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.12) 0%, rgba(0, 0, 0, 0) 70%);
      pointer-events: none;
      z-index: 0;
      animation: floatGlow 12s ease-in-out infinite alternate;
    }

    body::after {
      content: '';
      position: fixed;
      bottom: -20%;
      right: -10%;
      width: 65vw;
      height: 65vw;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(247, 37, 133, 0.12) 0%, rgba(157, 78, 221, 0.08) 50%, rgba(0, 0, 0, 0) 75%);
      pointer-events: none;
      z-index: 0;
      animation: floatGlow2 15s ease-in-out infinite alternate;
    }

    @keyframes floatGlow {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 60px) scale(1.1); }
    }

    @keyframes floatGlow2 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-50px, -40px) scale(1.15); }
    }

    .container {
      width: 100%;
      max-width: 1260px;
      margin: 0 auto;
      padding: 0 20px;
      position: relative;
      z-index: 1;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      background: rgba(7, 8, 15, 0.88);
      border-bottom: 1px solid var(--border-color);
      transition: var(--transition);
    }

    .nav-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 85px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: var(--text-main);
    }

    .brand-logo .logo-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--cyan), var(--purple), var(--magenta));
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 22px;
      color: #000;
      box-shadow: 0 0 25px var(--cyan-glow);
    }

    .brand-logo .brand-text {
      display: flex;
      flex-direction: column;
    }

    .brand-logo .brand-title {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 1.35rem;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #ffffff, var(--cyan), #9d4edd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-logo .brand-tag {
      font-size: 0.75rem;
      color: var(--cyan);
      letter-spacing: 2px;
      text-transform: uppercase;
      font-family: var(--font-heading);
      font-weight: 700;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
      list-style: none;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text-muted);
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.5px;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 6px;
      position: relative;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--cyan);
      text-shadow: 0 0 12px var(--cyan-glow);
    }

    .nav-links a.highlight-nav {
      color: var(--neon-gold);
      background: rgba(255, 183, 3, 0.12);
      padding: 6px 14px;
      border-radius: var(--radius-full);
      border: 1px solid rgba(255, 183, 3, 0.35);
    }

    .nav-links a.highlight-nav:hover {
      background: var(--neon-gold);
      color: #000;
      box-shadow: 0 0 20px var(--neon-gold-glow);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .btn-audio-toggle {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: var(--radius-full);
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: var(--transition);
    }

    .btn-audio-toggle:hover {
      background: rgba(0, 240, 255, 0.15);
      border-color: var(--cyan);
      color: var(--cyan);
      box-shadow: 0 0 15px var(--cyan-glow);
    }

    .btn-audio-toggle.muted {
      color: var(--text-muted);
      border-color: rgba(255, 255, 255, 0.1);
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(247, 37, 133, 0.15);
      color: var(--magenta);
      border: 1px solid rgba(247, 37, 133, 0.4);
      padding: 5px 14px;
      border-radius: var(--radius-full);
      font-size: 0.8rem;
      font-family: var(--font-display);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background-color: var(--magenta);
      border-radius: 50%;
      animation: pulse-dot 1.5s infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.4); }
    }

    .mobile-menu-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 1.6rem;
      cursor: pointer;
    }

    section {
      padding: 95px 0;
      position: relative;
    }

    .section-header {
      text-align: center;
      margin-bottom: 50px;
    }

    .section-tag {
      font-family: var(--font-display);
      font-size: 0.9rem;
      color: var(--cyan);
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 12px;
      display: inline-block;
    }

    .section-title {
      font-family: var(--font-display);
      font-size: 2.6rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #ffffff 30%, var(--cyan) 80%, var(--magenta) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .section-desc {
      color: var(--text-muted);
      max-width: 680px;
      margin: 0 auto;
      font-size: 1.1rem;
    }

    /* Hero Section */
    .hero-section {
      padding: 100px 0 80px 0;
      min-height: 90vh;
      display: flex;
      align-items: center;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.25fr 0.75fr;
      gap: 50px;
      align-items: center;
    }

    .hero-content {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .hero-headline {
      font-family: var(--font-display);
      font-size: 3.6rem;
      font-weight: 900;
      line-height: 1.12;
      letter-spacing: -1px;
    }

    .hero-headline span.highlight {
      background: linear-gradient(135deg, var(--cyan), var(--purple), var(--magenta));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 35px var(--cyan-glow);
    }

    .hero-subtitle {
      font-size: 1.25rem;
      color: var(--text-muted);
      max-width: 600px;
    }

    /* Audio Welcome Banner */
    .audio-welcome-card {
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.12), rgba(157, 78, 221, 0.12), rgba(247, 37, 133, 0.08));
      border: 1px solid rgba(0, 240, 255, 0.35);
      border-radius: var(--radius-md);
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      backdrop-filter: blur(14px);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4);
    }

    .audio-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .audio-wave-anim {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 26px;
    }

    .audio-bar {
      width: 4px;
      background: var(--cyan);
      border-radius: 2px;
      animation: sound-bars 0.8s ease-in-out infinite alternate;
    }

    .audio-bar:nth-child(1) { height: 8px; animation-delay: 0.1s; background: var(--cyan); }
    .audio-bar:nth-child(2) { height: 22px; animation-delay: 0.3s; background: var(--purple); }
    .audio-bar:nth-child(3) { height: 26px; animation-delay: 0.2s; background: var(--magenta); }
    .audio-bar:nth-child(4) { height: 14px; animation-delay: 0.4s; background: var(--neon-green); }

    @keyframes sound-bars {
      0% { height: 4px; }
      100% { height: 26px; }
    }

    .audio-text h4 {
      font-family: var(--font-heading);
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .audio-text p {
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .btn-play-voice {
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      color: #000;
      border: none;
      border-radius: var(--radius-full);
      padding: 11px 22px;
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: var(--transition);
      white-space: nowrap;
      box-shadow: 0 4px 20px var(--cyan-glow);
    }

    .btn-play-voice:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 6px 25px var(--cyan-glow);
    }

    .hero-cta-group {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      color: #000;
      text-decoration: none;
      padding: 15px 30px;
      border-radius: var(--radius-md);
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: 0.5px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: none;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 4px 25px var(--cyan-glow);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 35px rgba(0, 240, 255, 0.55);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      text-decoration: none;
      padding: 15px 30px;
      border-radius: var(--radius-md);
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 1.15rem;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--neon-gold);
      color: var(--neon-gold);
      box-shadow: 0 0 25px var(--neon-gold-glow);
    }

    /* Hero Streamer Card Preview */
    .hero-card-preview {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 32px;
      backdrop-filter: blur(22px);
      position: relative;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      border-top: 2px solid var(--cyan);
    }

    .streamer-profile {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
    }

    .avatar-wrapper {
      position: relative;
      width: 92px;
      height: 92px;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: linear-gradient(135deg, #18223d, #2b1154);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--cyan);
      border: 3px solid var(--cyan);
      box-shadow: 0 0 25px var(--cyan-glow);
    }

    .online-indicator {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 20px;
      height: 20px;
      background: var(--neon-green);
      border: 3px solid var(--bg-surface);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--neon-green);
    }

    .streamer-info h3 {
      font-family: var(--font-display);
      font-size: 1.5rem;
      margin-bottom: 4px;
    }

    .streamer-info p {
      color: var(--cyan);
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stream-status-box {
      background: rgba(0, 0, 0, 0.45);
      border: 1px dashed var(--border-color);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 20px;
    }

    .stream-meta-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 0.92rem;
    }

    .stream-meta-row:last-child {
      margin-bottom: 0;
    }

    .stream-meta-label {
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stream-meta-val {
      font-weight: 700;
      color: var(--text-main);
    }

    .stats-counters {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      text-align: center;
    }

    .stat-box {
      background: rgba(255, 255, 255, 0.03);
      border-radius: var(--radius-sm);
      padding: 12px 8px;
      border: 1px solid var(--border-color);
    }

    .stat-num {
      font-family: var(--font-display);
      font-size: 1.3rem;
      font-weight: 900;
      color: var(--cyan);
      display: block;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Roblox Section */
    .roblox-hub-section {
      background: linear-gradient(180deg, var(--bg-dark) 0%, #0d1222 50%, var(--bg-dark) 100%);
      border-top: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      position: relative;
    }

    .roblox-hub-banner {
      background: linear-gradient(135deg, rgba(224, 36, 36, 0.15), rgba(0, 240, 255, 0.15), rgba(157, 78, 221, 0.15));
      border: 2px solid var(--roblox-red);
      border-radius: var(--radius-lg);
      padding: 30px;
      margin-bottom: 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
      box-shadow: 0 15px 45px rgba(224, 36, 36, 0.2);
    }

    .roblox-banner-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .roblox-logo-badge {
      width: 64px;
      height: 64px;
      background: var(--roblox-red);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      color: #fff;
      box-shadow: 0 0 25px rgba(224, 36, 36, 0.6);
    }

    .roblox-banner-text h3 {
      font-family: var(--font-display);
      font-size: 1.5rem;
      color: #fff;
    }

    .roblox-banner-text p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .btn-redeem-official {
      background: var(--neon-green);
      color: #000;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: var(--radius-full);
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 1.05rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 20px var(--neon-green-glow);
      transition: var(--transition);
    }

    .btn-redeem-official:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 30px var(--neon-green-glow);
    }

    .codes-search-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 30px;
      margin-bottom: 36px;
    }

    .search-input-wrapper {
      position: relative;
      margin-bottom: 20px;
    }

    .search-input-wrapper i {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--cyan);
      font-size: 1.2rem;
    }

    .codes-search-input {
      width: 100%;
      background: rgba(10, 13, 25, 0.9);
      border: 2px solid rgba(0, 240, 255, 0.4);
      border-radius: var(--radius-full);
      padding: 16px 20px 16px 54px;
      font-size: 1.1rem;
      color: #fff;
      font-family: var(--font-body);
      outline: none;
      transition: var(--transition);
    }

    .codes-search-input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 25px var(--cyan-glow);
    }

    .quick-games-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .quick-selector-label {
      font-family: var(--font-heading);
      font-weight: 700;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .game-chip-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: var(--radius-full);
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: po
