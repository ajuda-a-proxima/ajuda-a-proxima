<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ryan Brother</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">

<style>
body{
 margin:0;
 font-family:'Fredoka',sans-serif;
 color:#fff;
 text-align:center;
 background:url("https://images.unsplash.com/photo-1608889175123-8ee362201f81?auto=format&fit=crop&w=1200&q=80");
 background-size:cover;
 background-attachment:fixed;
}

h1{
 font-size:2.5em;
 color:#0ff;
 text-shadow:0 0 15px #000;
}

.box{
 background:rgba(0,0,0,0.7);
 margin:10px;
 padding:12px;
 border-radius:15px;
}

button{
 padding:10px;
 margin:5px;
 border:none;
 border-radius:10px;
 background:yellow;
 font-weight:bold;
 cursor:pointer;
}

iframe{
 width:300px;
 height:170px;
 border-radius:12px;
}

#gameBtn{
 font-size:20px;
 padding:18px;
 background:red;
 color:#fff;
}

</style>
</head>

<body>

<h1>🎮 RYAN BROTHER 🚀</h1>

<div class="box">
<button onclick="subscribe()">🔥 SE INSCREVER</button>
<button onclick="share()">📤 Compartilhar</button>
</div>

<div class="box">
<h2>💰 Moedas</h2>
<p id="coins">0</p>
</div>

<div class="box">
<h2>🏆 Ranking</h2>
<p id="record">0</p>
</div>

<div class="box">
<h2>📺 Vídeos</h2>
<iframe src="https://www.youtube.com/embed/2pT_e6ukSCo"></iframe>
<iframe src="https://www.youtube.com/embed/pvH9Rrqs_Uc"></iframe>
</div>

<div class="box">
<h2>🎯 Desafio</h2>
<p id="desafio"></p>
<button onclick="novoDesafio()">Novo desafio</button>
</div>

<div class="box">
<h2>🎮 Jogo</h2>
<button id="gameBtn" onclick="play()">CLICA!</button>
<p>Pontos: <span id="score">0</span></p>
</div>

<div class="box">
<h2>🎮 Jogos Online</h2>

<a href="https://www.crazygames.com/game/shell-shockers" target="_blank">
<button>🥚 Tiro</button>
</a>

<a href="https://www.crazygames.com/game/1v1-lol" target="_blank">
<button>🏗️ Construção</button>
</a>

<a href="https://poki.com/br/g/subway-surfers" target="_blank">
<button>🚆 Subway</button>
</a>

</div>

<script>

// DADOS
let score = 0;
let coins = localStorage.getItem("coins") || 0;
let record = localStorage.getItem("record") || 0;

document.getElementById("coins").innerText = coins;
document.getElementById("record").innerText = record;

// YOUTUBE
function subscribe(){
 window.open("https://youtube.com/@ryanbrother6541");
}

// SHARE
function share(){
 if(navigator.share){
  navigator.share({
   title:"Ryan Brother",
   text:"Olha esse site!",
   url:window.location.href
  });
 } else {
  navigator.clipboard.writeText(window.location.href);
  alert("Link copiado!");
 }
}

// DESAFIO
function novoDesafio(){
 let desafios=[
  "🔥 Faça 20 pontos",
  "🎮 Jogue 2 jogos",
  "🚀 Mostre para amigo",
  "😎 Bata o recorde"
 ];
 document.getElementById("desafio").innerText =
 desafios[Math.floor(Math.random()*desafios.length)];
}

// JOGO
function play(){
 score++;
 coins++;

 document.getElementById("score").innerText = score;
 document.getElementById("coins").innerText = coins;

 localStorage.setItem("coins", coins);

 if(score > record){
  record = score;
  localStorage.setItem("record", record);
  document.getElementById("record").innerText = record;
 }
}

// INICIO
novoDesafio();

</script>

<!-- CHAT REAL -->
<script src="//code.tidio.co/wncq2yipm8ocgfvy1cf81d5p8h7pdres.js" async></script>

</body>
</html>
