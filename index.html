<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ryan Brother</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
body{margin:0;background:#000;color:#fff;text-align:center;font-family:'Fredoka',sans-serif}
h1{color:#0ff}
button{padding:10px;margin:5px;border-radius:10px;border:none;background:#ff0}
.videos{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
iframe{width:280px;height:160px;border-radius:10px}
canvas{background:#fff;border-radius:10px;touch-action:none}
.colors{display:flex;justify-content:center;flex-wrap:wrap}
.color{width:30px;height:30px;border-radius:50%;margin:5px;cursor:pointer}
#gallery,#testimonials{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.card{background:#111;padding:10px;border-radius:10px}
#chat{height:120px;overflow:auto;background:#000;padding:5px;border-radius:5px}
</style>
</head>

<body>

<h1>🎮 RYAN BROTHER 🚀</h1>

<input id="name" placeholder="Seu nome">
<button onclick="login()">Entrar</button>
<p id="userDisplay"></p>

<h2>📺 Vídeos</h2>
<div class="videos">
<iframe src="https://www.youtube.com/embed/2pT_e6ukSCo"></iframe>
<iframe src="https://www.youtube.com/embed/pvH9Rrqs_Uc"></iframe>
<iframe src="https://www.youtube.com/embed/s5lKL9kgZNo"></iframe>
<iframe src="https://www.youtube.com/embed/Da8ti-pUHXA"></iframe>
</div>

<h2>🎨 Desenho</h2>
<canvas id="draw" width="300" height="300"></canvas>

<div class="colors">
<div class="color" style="background:red" onclick="setColor('red')"></div>
<div class="color" style="background:blue" onclick="setColor('blue')"></div>
<div class="color" style="background:green" onclick="setColor('green')"></div>
<div class="color" style="background:black" onclick="setColor('black')"></div>
</div>

<button onclick="mixColor()">🌈 Misturar</button>
<button onclick="clearCanvas()">🧹 Limpar</button>
<button onclick="saveDraw()">💾 Salvar</button>

<h2>🖼️ Galeria</h2>
<div id="gallery"></div>

<h2>🎮 Jogo</h2>
<button onclick="play()">CLICA</button>
<p id="score">0</p>

<h2>🏆 Ranking</h2>
<ul id="ranking"></ul>

<h2>🤖 RayBot</h2>
<div style="max-width:300px;margin:auto;">
<div id="chat"></div>
<input id="msg">
<button onclick="sendMsg()">Enviar</button>
</div>

<h2>💬 Testemunhos</h2>
<div id="testimonials"></div>

<input id="testName" placeholder="Nome">
<input id="testMsg" placeholder="Comentário">
<button onclick="sendTestimonial()">Enviar</button>

<script>

// CONFIG FIREBASE (SEU PROJETO)
const firebaseConfig = {
  apiKey: "AIzaSyCROWVPT74uPPmIk_mfpV3WDnoU15VzC9U",
  authDomain: "canal-ryan-brother-roblox.firebaseapp.com",
  databaseURL: "https://canal-ryan-brother-roblox-default-rtdb.firebaseio.com"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// LOGIN
let user="";
function login(){
 user=document.getElementById("name").value;
 if(!user)return alert("Digite nome");
 localStorage.setItem("user",user);
 document.getElementById("userDisplay").innerText="👤 "+user;
}
window.onload=function(){
 let saved=localStorage.getItem("user");
 if(saved){user=saved;document.getElementById("userDisplay").innerText="👤 "+user;}
};

// DESENHO
const canvas=document.getElementById("draw");
const ctx=canvas.getContext("2d");
let drawing=false,color="black";

function setColor(c){color=c;}

canvas.addEventListener("pointerdown",()=>drawing=true);
canvas.addEventListener("pointerup",()=>drawing=false);
canvas.addEventListener("pointermove",e=>{
 if(!drawing)return;
 let r=canvas.getBoundingClientRect();
 ctx.fillStyle=color;
 ctx.fillRect(e.clientX-r.left,e.clientY-r.top,4,4);
});

function mixColor(){
 color=`rgb(${Math.random()*255},${Math.random()*255},${Math.random()*255})`;
}

function clearCanvas(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
}

// SALVAR DESENHO
function saveDraw(){
 if(!user)return alert("Digite nome");
 let id=Date.now();
 let img=canvas.toDataURL();

 db.ref("draws/"+id).set({
   user:user,
   image:img,
   likes:0
 });
}

// GALERIA
db.ref("draws").on("value",snap=>{
 let data=snap.val()||{};
 let g=document.getElementById("gallery");
 g.innerHTML="";

 for(let id in data){
   let d=data[id];
   let div=document.createElement("div");
   div.className="card";

   div.innerHTML=`
   <p>${d.user}</p>
   <img src="${d.image}" width="120"><br>
   👍 ${d.likes||0}
   <button onclick="like('${id}')">Curtir</button>
   `;

   g.appendChild(div);
 }
});

function like(id){
 db.ref("draws/"+id+"/likes").transaction(v=>(v||0)+1);
}

// JOGO
let score=0;
function play(){
 score++;
 document.getElementById("score").innerText=score;

 if(user){
   db.ref("ranking/"+user).set(score);
 }
}

// RANKING
db.ref("ranking").on("value",snap=>{
 let data=snap.val()||{};
 let list=document.getElementById("ranking");
 list.innerHTML="";

 Object.keys(data).sort((a,b)=>data[b]-data[a]).slice(0,10).forEach(n=>{
   let li=document.createElement("li");
   li.innerText=n+" - "+data[n];
   list.appendChild(li);
 });
});

// IA
function sendMsg(){
 let input=document.getElementById("msg");
 let chat=document.getElementById("chat");
 let t=input.value.toLowerCase();

 chat.innerHTML+=`<p>👦 ${input.value}</p>`;

 let r="🤖 Tenta outra!";
 if(t.includes("desenho")) r="🎨 Desenha um robô!";
 else if(t.includes("jogo")) r="🎮 Clica no jogo!";
 else if(t.includes("oi")) r="👋 Oi! Vamos brincar!";

 setTimeout(()=>{
   chat.innerHTML+=`<p>${r}</p>`;
   chat.scrollTop=chat.scrollHeight;
 },400);

 input.value="";
}

// TESTEMUNHO
function sendTestimonial(){
 let name=document.getElementById("testName").value;
 let msg=document.getElementById("testMsg").value;

 if(!name||!msg)return;

 let id=Date.now();

 db.ref("testimonials/"+id).set({
   name:name,
   message:msg
 });
}

// CARREGAR TESTEMUNHOS
db.ref("testimonials").on("value",snap=>{
 let data=snap.val()||{};
 let div=document.getElementById("testimonials");

 div.innerHTML="";

 for(let id in data){
   let t=data[id];

   let card=document.createElement("div");
   card.className="card";

   card.innerHTML=`
   <p>${t.name}</p>
   <p>"${t.message}"</p>
   `;

   div.appendChild(card);
 }
});

</script>

</body>
</html>
